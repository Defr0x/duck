{% extends "base.html" %}
{% block title %}Вход — НейроЧат{% endblock %}
{% block body_class %}centered{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="auth-head">
        <div class="auth-logo">🧠</div>
        <h1>Вход в систему</h1>
        <p class="muted">С возвращением! Введите данные аккаунта.</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.ru" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="pass-wrap">
                <input type="password" id="password" name="password" placeholder="Ваш пароль" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" aria-label="Показать пароль">👁</button>
            </div>
        </div>

        <div id="error-msg" class="alert"></div>

        <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p class="switch-link">Нет аккаунта? <a href="{{ url_for('register_page') }}">Зарегистрироваться</a></p>
</div>
{% endblock %}
