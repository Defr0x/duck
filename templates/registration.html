{% extends "base.html" %}
{% block title %}Регистрация — НейроЧат{% endblock %}
{% block body_class %}centered{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="auth-head">
        <div class="auth-logo">🚀</div>
        <h1>Регистрация</h1>
        <p class="muted">Создайте аккаунт, чтобы общаться с нейросетью.</p>
    </div>

    <form id="registerForm" novalidate>
        <div class="form-group">
            <label for="fullname">Ваше имя</label>
            <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" autocomplete="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.ru" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="pass-wrap">
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" autocomplete="new-password" required>
                <button type="button" class="toggle-pass" aria-label="Показать пароль">👁</button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Повторите пароль</label>
            <div class="pass-wrap">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Ещё раз" autocomplete="new-password" required>
                <button type="button" class="toggle-pass" aria-label="Показать пароль">👁</button>
            </div>
        </div>

        <div id="error-msg" class="alert"></div>

        <button type="submit" class="btn btn-success btn-block">Зарегистрироваться</button>
    </form>

    <p class="switch-link">Уже есть аккаунт? <a href="{{ url_for('login_page') }}">Войти</a></p>
</div>
{% endblock %}
